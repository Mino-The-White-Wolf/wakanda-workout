name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Installer une version stable de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🦅 Installer Flutter (Requis pour l'APK)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 🛠️ Installer Flet
        run: pip install flet

      - name: ⚙️ Compiler l'Application Android
        run: flet build apk

      - name: 📦 Sauvegarder et Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Wakanda-Workout-APK
          path: build/apk/*.apk
