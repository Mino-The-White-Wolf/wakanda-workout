name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛠️ Installer Flet
        run: pip install flet

      - name: ⚙️ Compiler l'Application Android (Validation Auto)
        run: yes | flet build apk

      - name: 📦 Sauvegarder et Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Wakanda-Workout-APK
          path: build/apk/*.apk
